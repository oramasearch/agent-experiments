[project]
name = "agent-experiments"
version = "0.2.0"
description = "Designs, runs, watches, and explains AutoML studies"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "httpx>=0.28.1",
    "openai>=3.19.2",
]

[project.scripts]
agent-experiments-serve = "agent_experiments:serve"
experiments-agent-evals = "agent_experiments.evals:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
